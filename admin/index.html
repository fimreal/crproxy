<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>crproxy 管理控制台</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 主色调：清新绿色系 */
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-light: #6ee7b7;
            --primary-muted: #d1fae5;

            /* 背景 */
            --background: #f8fafc;
            --background-secondary: #f1f5f9;

            /* 文字 */
            --foreground: #0f172a;
            --foreground-muted: #64748b;

            /* 卡片 */
            --card: #ffffff;
            --card-border: #e2e8f0;

            /* 功能色 */
            --success: #10b981;
            --success-light: #d1fae5;
            --success-muted: #34d399;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --warning: #f59e0b;
            --warning-light: #fef3c7;

            /* 边框 */
            --border: #e2e8f0;

            /* 阴影 */
            --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);

            /* 圆角 */
            --radius-sm: 0.375rem;
            --radius: 0.625rem;
            --radius-lg: 0.875rem;
            --radius-xl: 1rem;

            /* 过渡 */
            --transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 暗色主题 */
        [data-theme="dark"] {
            --primary: #34d399;
            --primary-dark: #10b981;
            --primary-light: #6ee7b7;
            --primary-muted: #064e3b;

            --background: #0f172a;
            --background-secondary: #1e293b;
            --foreground: #f8fafc;
            --foreground-muted: #94a3b8;
            --card: #1e293b;
            --card-border: #334155;
            --border: #334155;
            --success: #34d399;
            --success-light: #064e3b;
            --danger: #f87171;
            --danger-light: #450a0a;
            --warning: #fbbf24;
            --warning-light: #451a03;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--background);
            min-height: 100vh;
            color: var(--foreground);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* 登录页面 */
        .login-container {
            max-width: 400px;
            margin: 80px auto;
            background: var(--card);
            padding: 40px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--card-border);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        .login-header .icon svg {
            width: 100%;
            height: 100%;
        }

        .login-header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .login-header p {
            color: var(--foreground-muted);
            margin-top: 6px;
            font-size: 14px;
        }

        .login-form input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 15px;
            transition: var(--transition);
            background: var(--background);
            color: var(--foreground);
        }

        .login-form input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-muted);
        }

        .login-form button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .login-form button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .login-form button:active {
            transform: translateY(0);
        }

        .error-message {
            color: var(--danger);
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            padding: 10px;
            background: var(--danger-light);
            border-radius: var(--radius-sm);
        }

        #app {
            display: none;
            background: var(--background);
            min-height: 100vh;
        }

        /* 顶部导航 */
        .app-header {
            background: var(--card);
            border-bottom: 1px solid var(--card-border);
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-header .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-header .brand-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .app-header .brand-icon svg {
            width: 100%;
            height: 100%;
        }

        .app-header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .nav-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-icon {
            padding: 8px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            color: var(--foreground-muted);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            background: var(--background-secondary);
            color: var(--foreground);
            border-color: var(--card-border);
        }

        .btn-icon svg {
            width: 18px;
            height: 18px;
        }

        .logout-btn {
            padding: 8px 16px;
            background: transparent;
            color: var(--foreground);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .logout-btn:hover {
            background: var(--background-secondary);
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
            padding: 4px;
            background: var(--background-secondary);
            border-radius: var(--radius);
            width: fit-content;
        }

        .tab-btn {
            padding: 10px 20px;
            background: transparent;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            border-radius: calc(var(--radius) - 2px);
            color: var(--foreground-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            color: var(--foreground);
        }

        .tab-btn.active {
            background: var(--card);
            color: var(--foreground);
            box-shadow: var(--shadow-sm);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Cards */
        .card {
            background: var(--card);
            padding: 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            margin-bottom: 20px;
            border: 1px solid var(--card-border);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--card-border);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
        }

        th {
            font-weight: 500;
            color: var(--foreground-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--card-border);
        }

        td {
            border-bottom: 1px solid var(--card-border);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: var(--background-secondary);
        }

        /* Buttons */
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            opacity: 0.9;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: var(--background-secondary);
            color: var(--foreground);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--card-border);
        }

        /* Forms */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-weight: 500;
            font-size: 13px;
            color: var(--foreground-muted);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            transition: var(--transition);
            height: 40px;
            background: var(--background);
            color: var(--foreground);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-muted);
        }

        .form-group input[readonly] {
            background: var(--background-secondary);
            cursor: not-allowed;
            color: var(--foreground-muted);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .stat-card {
            background: var(--background);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: var(--radius);
            transition: var(--transition);
        }

        .stat-card:hover {
            border-color: var(--primary-light);
        }

        .stat-card.green .stat-value {
            color: var(--success);
        }

        .stat-card.blue .stat-value {
            color: var(--primary);
        }

        .stat-card.orange .stat-value {
            color: var(--warning);
        }

        .stat-card.red .stat-value {
            color: var(--danger);
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--foreground-muted);
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 72px;
            right: 24px;
            padding: 12px 20px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            animation: slideIn 0.2s ease;
            box-shadow: var(--shadow-lg);
            background: var(--card);
            color: var(--foreground);
            border: 1px solid var(--card-border);
            white-space: pre-line;
            line-height: 1.5;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgb(0 0 0 / 0.5);
            backdrop-filter: blur(4px);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--card);
            padding: 24px;
            border-radius: var(--radius-lg);
            max-width: 380px;
            width: 90%;
            text-align: center;
            box-shadow: var(--shadow-xl);
        }

        .modal-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
            background: var(--warning-light);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .modal-content p {
            margin: 8px 0 20px;
            color: var(--foreground-muted);
            font-size: 14px;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .modal-buttons .btn {
            min-width: 80px;
        }

        /* Warning Box */
        .warning-box {
            margin-top: 20px;
            padding: 16px;
            background: var(--warning-light);
            border-radius: var(--radius);
            border: 1px solid var(--warning);
        }

        .warning-box h3 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .warning-box p {
            color: var(--foreground-muted);
            margin-bottom: 12px;
            font-size: 13px;
        }

        /* Misc */
        .badge {
            display: inline-flex;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 500;
            background: var(--background-secondary);
            color: var(--foreground-muted);
            margin-left: 6px;
        }

        .loading {
            text-align: center;
            padding: 32px;
            color: var(--foreground-muted);
            font-size: 14px;
        }

        small {
            font-size: 12px;
            color: var(--foreground-muted);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .tabs {
                width: 100%;
            }

            .tab-btn {
                flex: 1;
                justify-content: center;
            }

            .app-header .container {
                padding: 0 16px;
            }

            .container {
                padding: 16px;
            }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- 登录页面 -->
    <div id="login-page" class="login-container">
        <div class="login-header">
            <div class="icon">
                <!-- Light mode icon -->
                <svg class="icon-light" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <clipPath id="box-clip-light">
                            <rect x="2" y="2" width="20" height="20" rx="6" />
                        </clipPath>
                    </defs>
                    <rect x="2" y="2" width="20" height="20" rx="6" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.2" />
                    <g clip-path="url(#box-clip-light)">
                        <g>
                            <rect x="0" y="12" width="13" height="6" rx="1.5" fill="#2496ED" />
                            <line x1="3.5" y1="12" x2="3.5" y2="18" stroke="white" stroke-opacity="0.4" stroke-width="0.6" />
                            <line x1="6.5" y1="12" x2="6.5" y2="18" stroke="white" stroke-opacity="0.4" stroke-width="0.6" />
                            <line x1="9.5" y1="12" x2="9.5" y2="18" stroke="white" stroke-opacity="0.4" stroke-width="0.6" />
                            <text x="2" y="12" font-size="9">🐳</text>
                            <animateTransform attributeName="transform" type="translate" from="24 0" to="-16 0" dur="4s" repeatCount="indefinite" />
                            <animateTransform attributeName="transform" type="translate" values="0 0; 0 -0.5; 0 0" dur="0.8s" repeatCount="indefinite" additive="sum" />
                        </g>
                        <path d="M2 18.5 H 22" stroke="#BAE6FD" stroke-width="0.5" stroke-dasharray="1 1" />
                    </g>
                    <circle cx="18" cy="6" r="1" fill="#10B981">
                        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
                    </circle>
                </svg>
                <!-- Dark mode icon -->
                <svg class="icon-dark" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display: none;">
                    <defs>
                        <clipPath id="inner-view-dark">
                            <rect x="2" y="2" width="20" height="20" rx="6" />
                        </clipPath>
                    </defs>
                    <rect x="2" y="2" width="20" height="20" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
                    <g clip-path="url(#inner-view-dark)">
                        <line x1="2" y1="18.5" x2="22" y2="18.5" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 2" />
                        <g>
                            <rect x="0" y="12" width="12" height="6.5" rx="1.5" fill="#3B82F6" />
                            <path d="M3.5 12V18.5M6 12V18.5M8.5 12V18.5" stroke="white" stroke-opacity="0.2" stroke-width="0.8"/>
                            <text x="1.5" y="12" font-size="9" style="user-select: none;">🐳</text>
                            <animateTransform attributeName="transform" type="translate" from="24 0" to="-16 0" dur="4s" repeatCount="indefinite" />
                            <animateTransform attributeName="transform" type="translate" values="0 0; 0 -0.4; 0 0" dur="1s" repeatCount="indefinite" additive="sum" />
                        </g>
                    </g>
                    <rect x="2" y="2" width="20" height="20" rx="6" fill="none" stroke="#3B82F6" stroke-width="1.2" opacity="0.4" />
                    <circle cx="18" cy="6" r="1.2" fill="#10B981">
                        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
                    </circle>
                </svg>
            </div>
            <h1>crproxy</h1>
            <p data-i18n="loginSubtitle">容器镜像代理管理控制台</p>
        </div>
        <form class="login-form" onsubmit="handleLogin(event)">
            <input type="password" id="password" data-i18n-placeholder="password" placeholder="输入管理密码" required>
            <button type="submit" data-i18n="login">登录</button>
        </form>
        <div id="login-error" class="error-message" style="display: none;"></div>
    </div>

    <!-- 主应用 -->
    <div id="app">
        <div class="app-header">
            <div class="container">
                <div class="brand">
                    <div class="brand-icon">
                        <!-- Light mode icon -->
                        <svg class="icon-light" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <clipPath id="nav-clip-light">
                                    <rect x="2" y="2" width="20" height="20" rx="6" />

                            <rect x="2" y="2" width="20" height="20" rx="6" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.2" />

                            </g>
                            <circle cx="18" cy="6" r="1" fill="#10B981">
                                <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
                            </circle>
                        </svg>
                        <!-- Dark mode icon -->
                        <svg class="icon-dark" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display: none;">
                            <defs>
                                <clipPath id="nav-clip-dark">
                                    <rect x="2" y="2" width="20" height="20" rx="6" />

                            </defs>

        // 主题管理
        const ThemeManager = {
            userPreference: 'auto',

            init() {
                const savedPreference = localStorage.getItem('theme-preference') || 'auto';
                this.userPreference = savedPreference;
                this.applyTheme();
                this.watchSystemTheme();
                this.updateIcon();
            },

            getSystemTheme() {
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            },

            applyTheme() {
                let theme;
                if (this.userPreference === 'auto') {
                    theme = this.getSystemTheme();
                } else {
                    theme = this.userPreference;
                }
                document.documentElement.setAttribute('data-theme', theme);
                this.updateBrandIcons(theme);
            },

            updateBrandIcons(theme) {
                // 更新登录页和导航栏的品牌图标
                document.querySelectorAll('.icon-light').forEach(el => {
                    el.style.display = theme === 'dark' ? 'none' : 'block';
                });
                document.querySelectorAll('.icon-dark').forEach(el => {
                    el.style.display = theme === 'dark' ? 'block' : 'none';
                });
            },

            updateIcon() {
                const sunIcon = document.querySelector('.icon-sun');
                const moonIcon = document.querySelector('.icon-moon');
                const autoIcon = document.querySelector('.icon-auto');

                if (!sunIcon || !moonIcon || !autoIcon) return;

                sunIcon.style.display = 'none';
                moonIcon.style.display = 'none';
                autoIcon.style.display = 'none';

                if (this.userPreference === 'auto') {
                    autoIcon.style.display = 'block';
                } else if (this.userPreference === 'dark') {
                    moonIcon.style.display = 'block';
                } else {
                    sunIcon.style.display = 'block';
                }
            },

            toggle() {
                const modes = ['auto', 'light', 'dark'];
                const currentIndex = modes.indexOf(this.userPreference);
                const nextIndex = (currentIndex + 1) % modes.length;
                this.userPreference = modes[nextIndex];

                localStorage.setItem('theme-preference', this.userPreference);
                this.applyTheme();
                this.updateIcon();

                const messages = {
                    auto: '跟随系统',
                    light: '亮色主题',
                    dark: '暗色主题'
                };
                if (window.I18n) {
                    const langMessages = {
                        auto: I18n.t('themeAuto'),
                        light: I18n.t('themeLight'),
                        dark: I18n.t('themeDark')
                    };
                    showToast(langMessages[this.userPreference], 'info');
                } else {
                    showToast(messages[this.userPreference], 'info');
                }
            },

            watchSystemTheme() {
                const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                mediaQuery.addEventListener('change', (e) => {
                    if (this.userPreference === 'auto') {
                        this.applyTheme();
                        this.updateIcon();
                    }
                });
            }
        };

            t(key) {
                return this.translations[this.currentLang][key] || key;
            },

            setLanguage(lang) {
                if (this.currentLang === lang) return;
                this.currentLang = lang;
                localStorage.setItem('lang', lang);
                this.updateUI();
                // 重新加载配置以更新动态内容（表格中的按钮等）
                if (document.getElementById('app').style.display === 'block') {
                    loadConfig();
                }
            },

            updateUI() {
                // 更新 data-i18n 元素
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    el.textContent = this.t(key);
                });

                // 更新 data-i18n-placeholder 元素
                document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                    const key = el.getAttribute('data-i18n-placeholder');
                    el.placeholder = this.t(key);
                });

                // 更新语言切换按钮
                const langBtn = document.getElementById('lang-toggle');
                if (langBtn) {
                    langBtn.textContent = this.t('langToggle');
                }

                // 更新缓存目录输入框（如果值为空或显示"未启用缓存"）
                const cacheDirInput = document.getElementById('cache-dir');
                if (cacheDirInput && (!cacheDirInput.value || cacheDirInput.value.includes('未启用') || cacheDirInput.value.includes('not enabled'))) {
                    cacheDirInput.value = this.t('cacheNotEnabled');
                }
            },

            init() {
                // 优先级：1. 用户手动设置  2. 浏览器语言  3. 默认中文
                let savedLang = localStorage.getItem('lang');

                if (!savedLang) {
                    // 自动检测浏览器语言
                    const browserLang = navigator.language || navigator.userLanguage;
                    // 如果浏览器语言是中文（zh, zh-CN, zh-TW等），则使用中文
                    if (browserLang && browserLang.toLowerCase().startsWith('zh')) {
                        savedLang = 'zh';
                    } else {
                        // 其他语言默认使用英文
                        savedLang = 'en';
                    }
                    // 保存自动检测的语言（但不标记为用户手动设置）
                }

                this.setLanguage(savedLang);
            }
        };

        let token = localStorage.getItem('admin_token');

        // 页面加载时检查登录状态
        document.addEventListener('DOMContentLoaded', () => {
            // 初始化主题
            ThemeManager.init();

            // 绑定主题切换按钮
            const themeToggle = document.getElementById('theme-toggle');
            if (themeToggle) {
                themeToggle.addEventListener('click', () => {
                    ThemeManager.toggle();
                });
            }

            // 初始化国际化
            I18n.init();

            // 绑定语言切换按钮
            const langToggle = document.getElementById('lang-toggle');
            if (langToggle) {
                langToggle.addEventListener('click', () => {
                    const newLang = I18n.currentLang === 'zh' ? 'en' : 'zh';
                    I18n.setLanguage(newLang);
                });
            }

            if (token) {
                showApp();
            }
        });

        // 登录处理
        async function handleLogin(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/admin/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({password})
                });

                const data = await response.json();

                if (response.ok) {
                    token = data.token;
                    localStorage.setItem('admin_token', token);
                    showApp();
                } else {
                    const errorDiv = document.getElementById('login-error');
                    errorDiv.textContent = data.error || '登录失败';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                const errorDiv = document.getElementById('login-error');
                errorDiv.textContent = '网络错误，请重试';
                errorDiv.style.display = 'block';
            }
        }

        // 显示主应用
        function showApp() {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            loadConfig();
            loadStats();
            // 自动刷新统计
            setInterval(loadStats, 5000);
        }

        // 退出登录
        function logout() {
            localStorage.removeItem('admin_token');
            token = null;
            location.reload();
        }

        // 切换标签
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            document.querySelector(`[onclick="switchTab('${tabName}')"]`).classList.add('active');
            document.getElementById(`${tabName}-tab`).classList.add('active');

            if (tabName === 'stats') {
                loadStats();
            }
            if (tabName === 'update') {
                checkUpdate();
            }
        }

        // 加载配置
        async function loadConfig() {
            try {
                const response = await fetch('/admin/api/config', {
                    headers: {'Authorization': `Bearer ${token}`}
                });

                if (response.status === 401) {
                    logout();
                    return;
                }

                const config = await response.json();

                // 填充 Registry 表格
                const tbody = document.getElementById('registry-tbody');
                tbody.innerHTML = '';
                for (const [name, url] of Object.entries(config.registryMap || {})) {
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${name}</strong></td>
                            <td>${url}</td>
                            <td>
                                ${name !== 'default' ? `<button class="btn btn-danger" onclick="deleteRegistry('${name}')">${I18n.t('delete')}</button>` : ''}
                            </td>
                        </tr>
                    `;
                }

                // 添加新行
                tbody.innerHTML += `
                    <tr style="background: var(--background-secondary);">
                        <td><input type="text" id="new-registry-name" data-i18n-placeholder="registryName" placeholder="${I18n.t('registryName')}" style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); color: var(--foreground);"></td>
                        <td><input type="text" id="new-registry-url" placeholder="https://example.com" style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); color: var(--foreground);"></td>
                        <td><button class="btn btn-primary" onclick="addRegistry()">${I18n.t('add')}</button></td>
                    </tr>
                `;

                // 填充服务参数表单
                document.getElementById('default-registry').value = config.defaultRegistry || '';
                document.getElementById('domain-suffix').value = config.domainSuffix || '';
                document.getElementById('log-level').value = config.logLevel || 'info';
                document.getElementById('cache-dir').value = config.cacheDir || I18n.t('cacheNotEnabled');
            } catch (error) {
                showToast(I18n.t('loadConfigFailed') + ': ' + error.message, 'error');
            }
        }

        // 保存配置
        async function saveConfig() {
            try {
                // 先获取当前完整配置
                const currentResponse = await fetch('/admin/api/config', {
                    headers: {'Authorization': `Bearer ${token}`}
                });

                if (!currentResponse.ok) {
                    showToast(I18n.t('getCurrentConfigFailed'), 'error');
                    return;
                }

                const currentConfig = await currentResponse.json();

                // 只更新修改的字段（缓存目录不可修改）
                currentConfig.defaultRegistry = document.getElementById('default-registry').value;
                currentConfig.domainSuffix = document.getElementById('domain-suffix').value;
                currentConfig.logLevel = document.getElementById('log-level').value;

                // 发送完整配置
                const response = await fetch('/admin/api/config', {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(currentConfig)
                });

                const data = await response.json();

                if (response.ok) {
                    showToast(I18n.t('configSaved') + '\n' + I18n.t('configRestartNote'), 'success');
                    loadConfig();
                } else {
                    showToast(data.error || I18n.t('saveFailed'), 'error');
                }
            } catch (error) {
                showToast(I18n.t('saveConfigFailed') + ': ' + error.message, 'error');
            }
        }

        // 添加 Registry
        async function addRegistry() {
            const name = document.getElementById('new-registry-name').value.trim();
            const url = document.getElementById('new-registry-url').value.trim();

            if (!name || !url) {
                showToast(I18n.t('pleaseFillNameAndUrl'), 'error');
                return;
            }

            try {
                const response = await fetch('/admin/api/registry', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({name, url})
                });

                const data = await response.json();

                if (response.ok) {
                    showToast(I18n.t('addSuccess'), 'success');
                    document.getElementById('new-registry-name').value = '';
                    document.getElementById('new-registry-url').value = '';
                    loadConfig();
                } else {
                    showToast(data.error || I18n.t('addFailed'), 'error');
                }
            } catch (error) {
                showToast(I18n.t('addFailed') + ': ' + error.message, 'error');
            }
        }

        // 删除 Registry
        async function deleteRegistry(name) {
            if (!confirm(`确定要删除 registry "${name}" 吗？`)) {
                return;
            }

            try {
                const response = await fetch(`/admin/api/registry/${name}`, {
                    method: 'DELETE',
                    headers: {'Authorization': `Bearer ${token}`}
                });

                const data = await response.json();

                if (response.ok) {
                    showToast(I18n.t('deleteSuccess'), 'success');
                    loadConfig();
                } else {
                    showToast(data.error || I18n.t('deleteFailed'), 'error');
                }
            } catch (error) {
                showToast(I18n.t('deleteFailed') + ': ' + error.message, 'error');
            }
        }

        // 加载统计
        async function loadStats() {
            try {
                // 请求统计
                const reqResponse = await fetch('/admin/api/stats', {
                    headers: {'Authorization': `Bearer ${token}`}
                });

                if (reqResponse.status === 401) {
                    logout();
                    return;
                }

                const reqStats = await reqResponse.json();
                const totalReqs = reqStats.totalRequests || 0;
                const cacheHits = reqStats.cacheHits || 0;
                const hitRate = totalReqs > 0 ? ((cacheHits / totalReqs) * 100).toFixed(1) : 0;

                // 格式化 uptime
                const uptimeSeconds = reqStats.uptime || 0;
                const days = Math.floor(uptimeSeconds / 86400);
                const hours = Math.floor((uptimeSeconds % 86400) / 3600);
                const minutes = Math.floor((uptimeSeconds % 3600) / 60);
                let uptimeStr = '';
                if (days > 0) uptimeStr += `${days}d `;
                if (hours > 0 || days > 0) uptimeStr += `${hours}h `;
                uptimeStr += `${minutes}m`;

                document.getElementById('request-stats').innerHTML = `
                    <div class="stat-card">
                        <div class="stat-value">${totalReqs.toLocaleString()}</div>
                        <div class="stat-label">${I18n.t('requestTotal')}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${uptimeStr}</div>
                        <div class="stat-label">${I18n.t('uptime')}</div>
                    </div>
                `;

                // 缓存统计
                const cacheResponse = await fetch('/admin/api/cache/stats', {
                    headers: {'Authorization': `Bearer ${token}`}
                });
                const cacheStats = await cacheResponse.json();

                if (cacheStats.enabled) {
                    const sizeInMB = (cacheStats.totalSize / 1024 / 1024).toFixed(2);
                    document.getElementById('cache-stats').innerHTML = `
                        <div class="stat-card green">
                            <div class="stat-value">${cacheHits.toLocaleString()}</div>
                            <div class="stat-label">${I18n.t('cacheHits')}</div>
                        </div>
                        <div class="stat-card orange">
                            <div class="stat-value">${(reqStats.cacheMisses || 0).toLocaleString()}</div>
                            <div class="stat-label">${I18n.t('cacheMisses')}</div>
                        </div>
                        <div class="stat-card blue">
                            <div class="stat-value">${hitRate}%</div>
                            <div class="stat-label">${I18n.t('hitRate')}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${(cacheStats.blobCount || 0).toLocaleString()}</div>
                            <div class="stat-label">${I18n.t('cachedLayers')}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${sizeInMB}</div>
                            <div class="stat-label">${I18n.t('totalSizeMB')}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${(cacheStats.totalFiles || 0).toLocaleString()}</div>
                            <div class="stat-label">${I18n.t('totalFiles')}</div>
                        </div>
                    `;
                } else {
                    document.getElementById('cache-stats').innerHTML = `
                        <div class="stat-card green">
                            <div class="stat-value">${cacheHits.toLocaleString()}</div>
                            <div class="stat-label">${I18n.t('cacheHits')}</div>
                        </div>
                        <div class="stat-card orange">
                            <div class="stat-value">${(reqStats.cacheMisses || 0).toLocaleString()}</div>
                            <div class="stat-label">${I18n.t('cacheMisses')}</div>
                        </div>
                        <div class="stat-card blue">
                            <div class="stat-value">${hitRate}%</div>
                            <div class="stat-label">${I18n.t('hitRate')}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${I18n.t('notEnabled')}</div>
                            <div class="stat-label">${I18n.t('cacheStatus')}</div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error(I18n.t('loadStatsFailed') + ':', error);
            }
        }

        // 确认清空缓存
        function confirmClearCache() {
            document.getElementById('confirm-modal').classList.add('show');
        }

        // 关闭对话框
        function closeModal() {
            document.getElementById('confirm-modal').classList.remove('show');
        }

        // 清空缓存
        async function clearCache() {
            closeModal();

            try {
                const response = await fetch('/admin/api/cache/clear', {
                    method: 'POST',
                    headers: {'Authorization': `Bearer ${token}`}
                });

                const data = await response.json();

                if (response.ok) {
                    showToast(`${I18n.t('cacheCleared')}, ${I18n.t('deleted')} ${data.deleted} ${I18n.t('files')}`, 'success');
                    loadStats();
                } else {
                    showToast(data.error || I18n.t('clearCacheFailed'), 'error');
                }
            } catch (error) {
                showToast(I18n.t('clearCacheFailed') + ': ' + error.message, 'error');
            }
        }

        // Toast 通知
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = message.replace(/\n/g, '<br>');

            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // 检查更新
        async function checkUpdate() {
            try {
                const response = await fetch('/admin/api/update/check', {
                    headers: {'Authorization': `Bearer ${token}`}
                });

                if (response.status === 401) {
                    logout();
                    return;
                }

                const info = await response.json();
                const updateInfoDiv = document.getElementById('update-info');
                const updateActionsDiv = document.getElementById('update-actions');

                // 如果需要重启，显示重启提示
                if (info.restartPending) {
                    showUpdatePendingRestart(info.latestVersion);
                    return;
                }

                if (info.hasUpdate) {
                    updateInfoDiv.innerHTML = `
                        <div class="stats-grid" style="margin-bottom: 0;">
                            <div class="stat-card">
                                <div class="stat-value">${info.currentVersion}</div>
                                <div class="stat-label">${I18n.t('currentVersion')}</div>
                            </div>
                            <div class="stat-card green">
                                <div class="stat-value">${info.latestVersion}</div>
                                <div class="stat-label">${I18n.t('latestVersion')}</div>
                            </div>
                        </div>
                    `;
                    updateActionsDiv.style.display = 'block';
                } else {
                    updateInfoDiv.innerHTML = `
                        <div class="stats-grid" style="margin-bottom: 0;">
                            <div class="stat-card green">
                                <div class="stat-value">${info.currentVersion}</div>
                                <div class="stat-label">${I18n.t('currentVersion')} (${I18n.t('upToDate')})</div>
                            </div>
                        </div>
                    `;
                    updateActionsDiv.style.display = 'none';
                }
            } catch (error) {
                document.getElementById('update-info').innerHTML = `
                    <div style="color: var(--danger);">${I18n.t('checkUpdateFailed')}: ${error.message}</div>
                `;
            }
        }

        // 显示更新待重启状态
        function showUpdatePendingRestart(newVersion) {
            const updateInfoDiv = document.getElementById('update-info');
            const updateActionsDiv = document.getElementById('update-actions');

            updateInfoDiv.innerHTML = `
                <div class="warning-box" style="margin-top: 0; background: var(--success-light); border-color: var(--success);">
                    <h3>${I18n.t('updateSuccess')}</h3>
                    <p>${I18n.t('newVersion')} <strong>${newVersion}</strong> ${I18n.t('downloadedRestartNeeded')}</p>
                </div>
            `;
            updateActionsDiv.style.display = 'none';
        }

        // 执行更新
        async function doUpdate() {
            const btn = document.getElementById('update-btn');
            btn.disabled = true;
            btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation: spin 1s linear infinite;"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg> ${I18n.t('updating')}`;

            try {
                const response = await fetch('/admin/api/update', {
                    method: 'POST',
                    headers: {'Authorization': `Bearer ${token}`}
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.newVersion) {
                        showToast(`${I18n.t('updateSuccess')}! ${I18n.t('newVersion')}: ${data.newVersion}`, 'success');
                        setTimeout(checkUpdate, 500);
                    } else {
                        showToast(I18n.t('alreadyLatestVersion'), 'success');
                        btn.disabled = false;
                        btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg> <span data-i18n="updateToLatest">${I18n.t('updateToLatest')}</span>`;
                    }
                } else {
                    showToast(data.error || I18n.t('updateFailed'), 'error');
                    btn.disabled = false;
                    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg> <span>${I18n.t('updateToLatest')}</span>`;
                }
            } catch (error) {
                showToast(I18n.t('updateFailed') + ': ' + error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg> <span>${I18n.t('updateToLatest')}</span>`;
            }
        }
    </script>
</body>
